        //確認瀏覽器有開起通知功能
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('firebase-messaging-sw.js')

        // 前台處理 FCM 訊息
        messaging.onMessage((payload) => {
            console.log("收到前台通知：", payload);
            
            // 存入 Cache Storage
            caches.open('fcm-messages').then((cache) => {
                cache.put('lastMessage', new Response(payload.data.oriMessage));
                document.getElementById("messageContainer").textContent = payload.data.oriMessage;
            });
        });

        window.addEventListener("load", () => {
            caches.open('fcm-messages').then(function (cacheStorage) {
                return cacheStorage.match('lastMessage');
            }).then(function (response) {
                if (response) {
                    return response.text().then(text => {
                        document.getElementById('messageContainer').textContent = text;
                        // 清除 Cache，避免下次載入時還看到舊訊息
                        caches.open('fcm-messages').then(cache => {
                            cache.delete('lastMessage');
                        });
                    });
                } else {
                    return "";
                }
            }).then(function (text) {
                document.getElementById('messageContainer').textContent = text;
            }).catch(function (error) {
                document.getElementById('messageContainer').textContent = "";
                console.error("讀取 Cache Storage 發生錯誤:", error);
            });
        });

        //確認權限
        function requestPermission() {
            console.log('Requesting permission...');
            Notification.requestPermission().then((permission) => {
                alert(permission);
                if (permission === 'granted') {
                    console.log('Notification permission granted.');
                    resetUI();
                } else {
                    console.log('Unable to get permission to notify.');
                    console.log(permission);
                }
            });
        }

                });
        }

    </script>
